<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alam Creative Academy | Learning Management System</title>
<meta name="description" content="Alam Creative Academy learning management system for students and administrators, with subjects, lectures, notes, tests, progress tracking and student support." />
<meta name="theme-color" content="#0B1A33" />
<meta property="og:title" content="Alam Creative Academy | LMS" />
<meta property="og:description" content="A modern learning management platform for Alam Creative Academy." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1A33; --navy-dark:#081327; --navy-mid:#132A52; --navy-soft:#1D3B6E;
    --gold:#E8A93B; --gold-dark:#CC8F26; --gold-soft:#FCEFD6;
    --bg:#F5F7FB; --card:#FFFFFF; --ink:#151E30; --sub:#71798C; --line:#E9ECF3;
    --green:#0F9D65; --green-bg:#E4F7EE;
    --purple:#6D4FE0; --purple-bg:#EEEAFB;
    --blue:#2C5CE0; --blue-bg:#E9EFFD;
    --red:#DC3545; --red-bg:#FDEAEC;
    --amber:#C77D12; --amber-bg:#FBF0DC;
    --radius:18px; --radius-sm:12px;
    --shadow-sm:0 1px 2px rgba(11,26,51,.05), 0 1px 1px rgba(11,26,51,.03);
    --shadow-md:0 8px 24px -8px rgba(11,26,51,.14);
    --shadow-gold:0 6px 18px -6px rgba(232,169,59,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.font-display{font-family:'Poppins',sans-serif;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c7d0e0;border-radius:8px;}

  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:264px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);color:#8E9BB8;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;transition:transform .25s ease;z-index:40;}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 10px 26px;}
  .brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:var(--shadow-gold);}
  .brand .name{font-family:'Poppins',sans-serif;font-weight:700;color:#fff;font-size:14px;line-height:1.2;letter-spacing:-.01em;}
  .brand .name span{display:block;color:var(--gold);font-size:10.5px;font-weight:600;letter-spacing:1.2px;margin-top:1px;}
  .nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:#8E9BB8;background:transparent;border:none;width:100%;text-align:left;position:relative;transition:background .12s ease,color .12s ease;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#E7ECF7;}
  .nav-item.active{background:rgba(232,169,59,.12);color:#fff;font-weight:600;}
  .nav-item.active svg{opacity:1;color:var(--gold);}
  .nav-item.active::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold);}
  .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.8px;color:#4C5A7A;text-transform:uppercase;padding:14px 12px 6px;}
  .nav-sep{height:1px;background:rgba(255,255,255,.07);margin:10px 4px;}

  .main{flex:1;min-width:0;}

  /* ---------- Topbar ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:13px 24px;}
  .menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--sub);}
  .search-box{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid transparent;border-radius:11px;padding:9px 14px;color:var(--sub);font-size:13px;}
  .topbar-right{display:flex;align-items:center;gap:18px;margin-left:auto;}
  .bell{position:relative;color:var(--navy);width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .bell .dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
  .user-chip{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line);}
  .avatar{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--navy-soft),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .user-chip .u-name{font-weight:700;font-size:13px;line-height:1.1;}
  .user-chip .u-role{font-size:11px;color:var(--sub);}
  .content{padding:22px;max-width:1500px;margin:0 auto;}

  /* ---------- Cards ---------- */
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:box-shadow .15s ease;}
  .card-pad{padding:22px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .section-head h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;}
  .view-all{font-size:12px;font-weight:700;color:var(--blue);}
  .grid{display:grid;gap:18px;}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:filter .12s ease,transform .12s ease;}
  .btn-gold{background:var(--gold);color:var(--navy-dark);box-shadow:var(--shadow-gold);}
  .btn-gold:hover{filter:brightness(1.04);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill-green{background:var(--green-bg);color:var(--green);}
  .pill-amber{background:var(--amber-bg);color:var(--amber);}
  .pill-red{background:var(--red-bg);color:var(--red);}
  .pill-blue{background:var(--blue-bg);color:var(--blue);}

  .dash-grid{display:grid;grid-template-columns:2.5fr 1fr;gap:18px;align-items:start;}
  .hero{background:radial-gradient(120% 160% at 100% 0%, rgba(232,169,59,.16), transparent 55%), linear-gradient(120deg,var(--navy) 0%,var(--navy-soft) 100%);border-radius:22px;padding:32px 34px;color:#fff;position:relative;overflow:hidden;min-height:180px;box-shadow:var(--shadow-md);}
  .hero h1{margin:0 0 6px;font-size:25px;line-height:1.3;font-weight:700;letter-spacing:-.01em;}
  .hero h1 .hi{color:var(--gold);}
  .hero p{margin:0 0 18px;color:#AEB9D4;font-size:13.5px;}
  .hero .btn{box-shadow:var(--shadow-gold);}
  .progress-ring{position:relative;width:150px;height:150px;margin:6px auto 4px;}
  .progress-ring svg{transform:rotate(-90deg);}
  .progress-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .progress-ring .pct b{font-size:24px;color:var(--navy);font-family:'Poppins',sans-serif;line-height:1.2;}
  .progress-ring .pct span{font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.2px;}
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .lbl{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;}
  .stat-row .val{font-weight:700;color:var(--navy);}

  .subj-grid{grid-template-columns:repeat(5,1fr);}
  .subj-card{padding:20px 14px;text-align:center;border-radius:16px;border:1px solid var(--line);background:#fff;transition:transform .12s ease,box-shadow .12s ease;}
  .subj-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .subj-icon{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;}
  .subj-card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;}
  .subj-card p{margin:0 0 14px;font-size:11.5px;color:var(--sub);}
  .subj-card .btn{width:100%;justify-content:center;}

  .lecture-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .lecture-row:last-child{border-bottom:none;}
  .lecture-thumb{width:64px;height:44px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;}
  .lecture-info{flex:1;min-width:150px;}
  .lecture-info h4{margin:0;font-size:13.5px;}
  .lecture-info p{margin:2px 0 6px;font-size:11.5px;color:var(--sub);}
  .bar-track{height:6px;background:var(--line);border-radius:6px;width:180px;max-width:40vw;}
  .bar-fill{height:6px;border-radius:6px;background:var(--blue);}
  .lecture-meta{font-size:11.5px;color:var(--sub);font-weight:600;margin-right:10px;white-space:nowrap;}

  .side-card{margin-bottom:18px;}
  .test-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;}
  .test-item .ic{width:34px;height:34px;border-radius:9px;background:var(--purple-bg);color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
  .test-item h4{margin:0;font-size:13px;}
  .test-item p{margin:2px 0 8px;font-size:11.5px;color:var(--sub);}

  .weak-row{margin-bottom:12px;}
  .weak-row .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px;}
  .weak-track{height:7px;border-radius:6px;background:var(--line);}
  .weak-fill{height:7px;border-radius:6px;}

  .doubt-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .doubt-item:last-child{border-bottom:none;}
  .doubt-item .ic{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
  .doubt-item h4{margin:0;font-size:12.5px;font-weight:600;}
  .doubt-item p{margin:2px 0 0;font-size:11px;color:var(--sub);}

  .quick-grid{grid-template-columns:repeat(4,1fr);}
  .quick-item{padding:22px 10px;text-align:center;border-radius:15px;border:1px solid var(--line);transition:transform .12s ease,box-shadow .12s ease;}
  .quick-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .quick-item .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;font-size:17px;}
  .quick-item h4{margin:0;font-size:12.5px;font-weight:600;}

  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .page-head h1{margin:0;font-size:22px;}
  .page-head p{margin:4px 0 0;color:var(--sub);font-size:13.5px;}
  .breadcrumb{font-size:12.5px;color:var(--sub);margin-bottom:6px;}
  .breadcrumb a{color:var(--blue);font-weight:600;}

  .subj-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .subj-hero .big-ic{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}

  .chapter-card{padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;}
  .chapter-card .chead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .chapter-card h3{margin:0;font-size:15px;}
  .chapter-card .cmeta{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .topic-row{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:var(--bg);border-radius:10px;margin-top:9px;font-size:13px;flex-wrap:wrap;gap:8px;}
  .topic-row .tname{font-weight:600;}
  .topic-row .tmeta{color:var(--sub);font-size:11px;}
  .topic-actions{display:flex;gap:7px;flex-wrap:wrap;}

  .upload-box{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px;background:#fbfcfe;}
  .upload-box input{display:none;}
  .file-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;}
  .file-row .fic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .file-row .finfo{flex:1;min-width:0;}
  .file-row .finfo h4{margin:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-row .finfo p{margin:2px 0 0;font-size:11.5px;color:var(--sub);}
  .icon-btn{border:none;background:var(--bg);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0;}
  .icon-btn:hover{background:var(--red-bg);color:var(--red);}

  form label{display:block;font-size:12.5px;font-weight:600;margin:0 0 5px;color:var(--ink);}
  form select,form input[type=text],form input[type=number],form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;margin-bottom:14px;background:#fff;}
  form textarea{resize:vertical;min-height:80px;}

  .subj-tab-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .subj-tab{padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
  .subj-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .test-card{padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .test-card .tinfo{flex:1;min-width:180px;}
  .test-card h3{margin:0 0 3px;font-size:14.5px;}
  .test-card p{margin:0;font-size:12px;color:var(--sub);}

  .timer-badge{background:var(--navy);color:#fff;padding:8px 16px;border-radius:11px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;min-width:92px;justify-content:center;}
  .timer-badge.low{background:var(--red);}
  .runner-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  .qprogress-track{height:8px;border-radius:6px;background:var(--line);margin-bottom:6px;}
  .qprogress-fill{height:8px;border-radius:6px;background:var(--gold);transition:width .3s;}
  .q-box{padding:22px;}
  .q-box .qsubj{font-size:11.5px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .q-box h3{font-size:16px;margin:0 0 18px;line-height:1.5;}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:11px;font-size:13.5px;font-weight:500;}
  .opt .letter{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .opt.selected{border-color:var(--blue);background:var(--blue-bg);}
  .opt.selected .letter{background:var(--blue);color:#fff;}
  .runner-nav{display:flex;justify-content:space-between;margin-top:20px;}

  .result-hero{text-align:center;padding:34px 20px;}
  .result-hero .score{font-size:44px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;}
  .result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;}
  .rstat{padding:16px;border-radius:14px;text-align:center;}
  .rstat b{display:block;font-size:22px;}
  .rstat span{font-size:11.5px;color:var(--sub);font-weight:600;}

  .doubt-full{display:flex;gap:10px;padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:11px;}
  .doubt-full .ic{width:34px;height:34px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .doubt-full h4{margin:0 0 3px;font-size:13.5px;}
  .doubt-full p{margin:0;font-size:12px;color:var(--sub);}

  .empty-state{text-align:center;padding:34px 18px;color:var(--sub);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;}

  .notes-box{padding:20px;border-radius:14px;border:1px solid var(--line);background:#fbfcfe;margin-bottom:14px;}
  .notes-box h4{margin:0 0 8px;font-size:13.5px;color:var(--navy);}
  .notes-box ul{margin:0;padding-left:20px;}
  .notes-box li{margin-bottom:9px;font-size:13.5px;line-height:1.6;}

  .chip-select{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:12.5px;font-weight:600;margin:0 8px 8px 0;cursor:pointer;background:#fff;}
  .chip-select input{accent-color:var(--navy);}
  .preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .preset-btn{padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;}
  .preset-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  @media (max-width:1100px){
    .dash-grid{grid-template-columns:1fr;}
    .subj-grid{grid-template-columns:repeat(3,1fr);}
    .quick-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:760px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3);}
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:flex;}
    .subj-grid{grid-template-columns:repeat(2,1fr);}
    .quick-grid{grid-template-columns:repeat(2,1fr);}
    .search-box{display:none;}
    .content{padding:14px;}
    .user-chip .u-role{display:none;}
    .result-stats{grid-template-columns:1fr;}
  }
  .overlay{position:fixed;inset:0;background:rgba(10,20,45,.45);z-index:35;display:none;}
  .overlay.show{display:block;}

  /* ---------- Login screen ---------- */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 140% at 20% 0%, rgba(232,169,59,.10), transparent 55%), var(--navy-dark);padding:20px;}
  .login-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;box-shadow:var(--shadow-md);padding:32px 28px;}
  .login-card .brand{padding:0 0 22px;justify-content:center;}
  .login-card .brand .name{color:var(--navy);}
  .login-card .brand .name span{color:var(--gold-dark);}
  .login-card h2{margin:0 0 4px;font-size:18px;text-align:center;}
  .login-card p.sub{margin:0 0 22px;color:var(--sub);font-size:12.5px;text-align:center;}
  .login-error{background:var(--red-bg);color:var(--red);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none;}
  .login-error.show{display:block;}
  .login-hint{margin-top:16px;padding:12px 14px;border-radius:11px;background:var(--bg);font-size:11.5px;color:var(--sub);line-height:1.6;}
  .id-badge{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--gold-dark);font-weight:700;font-size:11px;padding:3px 10px;border-radius:999px;letter-spacing:.2px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
<script>
/* =========================================================
   ICONS

/* =========================================================
   AUTH / API LAYER
   Talks to the Node backend (server.js) for login, sessions,
   Student IDs, and file storage. Nothing here trusts the client:
   the server re-checks auth and role on every request.
========================================================= */
const API = '/api';
let CURRENT_USER = null;   // {id, studentId, name, email, role, status, createdAt, activatedAt, lastLoginAt}
let CSRF_TOKEN = null;
let AUTH_ERROR = '';
let AUTH_NOTE = '';        // non-error info message on the auth screens
let authView = 'studentLogin'; // 'studentLogin' | 'activate' | 'adminLogin'

async function apiFetch(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if(opts.body && !(opts.body instanceof FormData)) headers['Content-Type']='application/json';
  if(CSRF_TOKEN && opts.method && opts.method!=='GET') headers['X-CSRF-Token']=CSRF_TOKEN;
  const res = await fetch(API+path, Object.assign({}, opts, {headers, credentials:'same-origin'}));
  if(res.status===401){ CURRENT_USER=null; CSRF_TOKEN=null; render(); }
  return res;
}
function fmtBytes(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(1)+' MB';
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso.replace(' ','T')+(iso.includes('Z')?'':'Z'));
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso.replace(' ','T')+(iso.includes('Z')?'':'Z'));
  if(isNaN(d)) return iso;
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function boot(){
  try{
    const res = await fetch(API+'/me', {credentials:'same-origin'});
    if(res.ok){
      const data = await res.json();
      CURRENT_USER = data.user; CSRF_TOKEN = data.csrfToken;
    } else {
      CURRENT_USER = null;
    }
  } catch(e){ CURRENT_USER = null; }
  render();
}

function goAuth(v){ authView=v; AUTH_ERROR=''; AUTH_NOTE=''; render(); }

async function handleStudentLoginSubmit(evt){
  evt.preventDefault();
  const identifier = document.getElementById('loginId').value.trim();
  const password = document.getElementById('loginPw').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    const res = await fetch(API+'/login', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({identifier, password, portal:'student'})
    });
    const data = await res.json();
    if(!res.ok){ AUTH_ERROR = data.error || 'Login failed'; btn.disabled=false; btn.textContent='Sign In'; render(); return; }
    CURRENT_USER = data.user; CSRF_TOKEN = data.csrfToken; AUTH_ERROR='';
    view = 'dashboard';
    render();
  } catch(e){
    AUTH_ERROR = 'Could not reach the server. Please try again.';
    render();
  }
}

async function handleActivateSubmit(evt){
  evt.preventDefault();
  const studentId = document.getElementById('actId').value.trim();
  const password = document.getElementById('actPw').value;
  const btn = document.getElementById('actBtn');
  btn.disabled = true; btn.textContent = 'Activating…';
  try{
    const res = await fetch(API+'/activate', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({studentId, password})
    });
    const data = await res.json();
    if(!res.ok){ AUTH_ERROR = data.error || 'Activation failed'; btn.disabled=false; btn.textContent='Activate Account'; render(); return; }
    CURRENT_USER = data.user; CSRF_TOKEN = data.csrfToken; AUTH_ERROR='';
    view = 'dashboard';
    render();
  } catch(e){
    AUTH_ERROR = 'Could not reach the server. Please try again.';
    render();
  }
}

async function handleAdminLoginSubmit(evt){

  } catch(e){
    AUTH_ERROR = 'Could not reach the server. Please try again.';

  }
}

async function doLogout(){
  try{ await apiFetch('/logout', {method:'POST'}); } catch(e){}
  CURRENT_USER = null; CSRF_TOKEN = null; FILES_CACHE = {lecture:null, notes:null}; ADMIN_STUDENTS = null;
  view = 'dashboard'; authView = 'studentLogin';
  render();
}

function mcq(q,opts,ans){return {q,opts,ans};}
function tp(id,name,notes,questions){return {id,name,notes,questions};}
function ch(id,name,topics){return {id,name,topics};}
function chNotes(c){ return c.topics.flatMap(t=>t.notes); }
function chQuestions(c){ return c.topics.flatMap(t=>t.questions.map(q=>({...q, topicId:t.id, topicName:t.name}))); }
function chQCount(c){ return c.topics.reduce((a,t)=>a+t.questions.length,0); }

function findChapter(subjId, chapId){
  const s = SUBJECTS.find(x=>x.id===subjId);
  const c = s.chapters.find(x=>x.id===chapId);
  return {s,c};
}
function findTopic(subjId, chapId, topicId){
  const {s,c} = findChapter(subjId,chapId);
  const t = c.topics.find(x=>x.id===topicId);
  return {s,c,t};
}

  const parts=[DB.lecturesWatched/DB.lecturesTotal, DB.notesDownloaded/DB.notesTotal, DB.testsAttempted/DB.testsTotal, DB.doubtsAsked/DB.doubtsTotal];
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}
function donutSVG(pct, size=150, stroke=14, color='var(--gold)'){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#EEF1F7" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg>`;
}
function subjectWeakness(subjId){
  const hist = DB.testHistory.filter(h=>h.subjId===subjId);
  if(hist.length===0){ const fallback={bio:65,chem:50,phy:40,eng:55,lr:70}; return fallback[subjId]; }
  const avg = hist.reduce((a,h)=>a+(h.score/h.total*100),0)/hist.length;
  return Math.round(avg);
}

function importMCQs(evt, subjId, chapId, topicId){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const text = e.target.result;
    const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
    const parsed = [];
    blocks.forEach(block=>{
      const qMatch = block.match(/Q:\s*(.+)/i);
      const optMatches = [...block.matchAll(/^[A-D]\)\s*(.+)$/gim)];
      const ansMatch = block.match(/Answer:\s*([A-D])/i);
      if(qMatch && optMatches.length===4 && ansMatch){
        const ansIdx = 'ABCD'.indexOf(ansMatch[1].toUpperCase());
        parsed.push(mcq(qMatch[1].trim(), optMatches.map(m=>m[1].trim()), ansIdx));
      }
    });
    if(parsed.length===0){ alert('No valid MCQs found. Please check the format.'); return; }
    const {t} = findTopic(subjId,chapId,topicId);
    t.questions.push(...parsed);
    alert(parsed.length+' MCQs added to "'+t.name+'". Total now: '+t.questions.length);
    render();
  };
  reader.readAsText(file);
}

// Files now live on the backend (see server.js -> /api/files). FILES_CACHE
// holds the last-fetched list per category; null means "not loaded yet".
let FILES_CACHE = { lecture: null, notes: null };
const CATEGORY_OF = { lectures: 'lecture', notes: 'notes' };

// ---------------------------------------------------------------------
// BUG FIX (Android file picker "select file -> nothing happens"):
// The old code put <input type="file"> INSIDE the reactive #app tree that
// render() fully replaces via innerHTML on every state change (including
// background fetches completing, like the file-list load that fires the
// moment this page opens). On a slow/flaky mobile connection, that
// background fetch can resolve WHILE the native Android file picker is
// still open, triggering render() and destroying the very <input> the
// picker's 'change' event was about to fire on -- so the event has
// nowhere to land and nothing happens, with no error at all.
//
// Fix: a single <input type="file"> lives OUTSIDE #app (appended directly
// to <body>, created once below, never touched by render()), so no amount
// of re-rendering elsewhere on the page can ever destroy it mid-picker.
// ---------------------------------------------------------------------
const ACCEPT_ATTR = '.pdf,application/pdf,.doc,application/msword,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.ppt,application/vnd.ms-powerpoint,.pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation,.xls,application/vnd.ms-excel,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,.jpg,.jpeg,image/jpeg,.png,image/png,.txt,text/plain';
const globalFileInput = document.createElement('input');
globalFileInput.type = 'file';
globalFileInput.accept = ACCEPT_ATTR;
globalFileInput.style.position = 'fixed';
globalFileInput.style.left = '-9999px';
globalFileInput.setAttribute('aria-hidden', 'true');
document.body.appendChild(globalFileInput);

let UPLOAD_CTX = null; // {subjId, category, chapter} captured at the moment "Choose File" is tapped
// UPLOAD_UI holds all upload state declaratively per category, so it survives
// any number of re-renders (it's plain JS data, not a DOM reference).
let UPLOAD_UI = {
  lecture: { status: 'idle', file: null, chapter: null, pct: 0, message: '' },
  notes:   { status: 'idle', file: null, chapter: null, pct: 0, message: '' },
};

function triggerFileUpload(subjId, category){
  const chapSel = document.getElementById('chapSelect_'+category);
  const chapter = chapSel ? chapSel.value : null;
  UPLOAD_CTX = { subjId, category, chapter };
  globalFileInput.value = ''; // allow re-selecting the same file twice in a row
  globalFileInput.click();
}
globalFileInput.addEventListener('change', function(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file || !UPLOAD_CTX) return;
  const { category } = UPLOAD_CTX;
  UPLOAD_UI[category] = { status: 'ready', file, chapter: UPLOAD_CTX.chapter, pct: 0, message: '' };
  render();
});
function cancelPendingUpload(category){
  UPLOAD_UI[category] = { status: 'idle', file: null, chapter: null, pct: 0, message: '' };
  render();
}
function confirmUpload(category){
  const ui = UPLOAD_UI[category];
  if(!ui || !ui.file || !UPLOAD_CTX) return;
  const { subjId } = UPLOAD_CTX;
  const s = SUBJECTS.find(x=>x.id===subjId);

  const fd = new FormData();
  fd.append('file', ui.file);
  fd.append('category', category);
  fd.append('subject', s.name);
  fd.append('chapter', ui.chapter || s.chapters[0].name);

  UPLOAD_UI[category] = { ...ui, status:'uploading', pct:0, message:'' };
  render();

  const xhr = new XMLHttpRequest();
  xhr.open('POST', API+'/files');
  xhr.withCredentials = true;
  if(CSRF_TOKEN) xhr.setRequestHeader('X-CSRF-Token', CSRF_TOKEN);
  // Deliberately not setting Content-Type: the browser must generate the
  // multipart boundary itself. Setting it manually on a FormData body is a
  // classic cause of broken/unparseable uploads.

  xhr.upload.onprogress = function(e){
    if(!e.lengthComputable) return;
    const pct = Math.round((e.loaded / e.total) * 100);
    UPLOAD_UI[category].pct = pct;
    // Fast path: update the bar directly so rapid progress events don't
    // thrash a full app re-render; renderFileManager will still reflect
    // the correct percentage if a re-render happens for any other reason.
    const bar = document.getElementById('uploadProgressFill_'+category);
    if(bar) bar.style.width = pct+'%';
  };
  xhr.onload = function(){
    let data = {};
    try{ data = JSON.parse(xhr.responseText||'{}'); }catch(e){}
    if(xhr.status>=200 && xhr.status<300){
      UPLOAD_UI[category] = { status:'success', file:null, chapter:null, pct:100, message:'Uploaded successfully.' };
      FILES_CACHE[category] = null;
      loadFiles(category); // re-fetches and calls render()
    } else {
      if(xhr.status===401){ CURRENT_USER=null; CSRF_TOKEN=null; render(); return; }
      UPLOAD_UI[category] = { status:'error', file:ui.file, chapter:ui.chapter, pct:0, message: data.error || `Upload failed (status ${xhr.status}).` };
      render();
    }
  };
  xhr.onerror = function(){
    UPLOAD_UI[category] = { status:'error', file:ui.file, chapter:ui.chapter, pct:0, message:'Network error during upload. Check your connection and try again.' };
    render();
  };
  xhr.send(fd);
}

async function loadFiles(category){
  try{
    const res = await apiFetch('/files?category='+category);
    const data = await res.json();
    FILES_CACHE[category] = res.ok ? data.files : [];
  }catch(e){ FILES_CACHE[category] = []; }
  render();
}
function renderFileManager(s, kindPage){
  const category = CATEGORY_OF[kindPage];
  if(FILES_CACHE[category]===null) loadFiles(category);
  const all = FILES_CACHE[category] || [];
  const list = all.filter(f=>f.subject===s.name);
  const label = category==='lecture' ? 'lecture file' : 'notes file';
  const chapOptions = s.chapters.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  const ui = UPLOAD_UI[category];

  let uploadBoxInner;
  if(ui.status==='ready'){
    uploadBoxInner = `
      <div style="text-align:left;max-width:380px;margin:0 auto;">
        <div style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:12px;">
          <div class="fic" style="background:${s.bg};color:${s.color}">${ic('file')}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ui.file.name}</div>
            <div style="font-size:11.5px;color:var(--sub);">${fmtBytes(ui.file.size)} · ${ui.chapter||s.chapters[0].name}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;">

        <div style="font-size:11.5px;color:var(--sub);margin-top:6px;">${ui.pct}%</div>

  } else {
    uploadBoxInner = `
      <div style="max-width:340px;margin:0 auto;text-align:left;">

  }

    <div style="display:block;font-size:12px;font-weight:600;margin-top:12px;padding:8px 12px;border-radius:9px;max-width:380px;margin-left:auto;margin-right:auto;
      background:${ui.status==='success'?'var(--green-bg)':'var(--red-bg)'};color:${ui.status==='success'?'var(--green)':'var(--red)'};">
      ${ui.message}
    </div>` : '';

  return `
  <div class="upload-box">
    ${ic('upload')}
    <p style="margin:8px 0 12px;">Add a new ${label} for <b>${s.name}</b></p>
    <p style="margin:0 0 12px;font-size:11.5px;color:var(--sub);">Accepted: PDF, DOC/DOCX, PPT/PPTX, XLS/XLSX, JPG/PNG, TXT — up to 25 MB. Works from Android's file picker and Windows/Mac file browsers.</p>
    ${uploadBoxInner}
    ${flash}
  </div>
  <div>

      list.length===0?`<div class="empty-state"><div class="ic">📂</div>No ${label}s uploaded yet for ${s.name}.</div>`:
      list.map(f=>`<div class="file-row">
        <div class="fic" style="background:${s.bg};color:${s.color}">${ic('file')}</div>
        <div class="finfo"><h4>${f.name}</h4><p>${f.chapter||''} · ${fmtBytes(f.sizeBytes)} · ${fmtDate(f.uploadedAt)} · by ${f.uploadedBy.name}</p></div>

      </div>`).join('')}
  </div>`;
}
async function deleteFile(category, id){
  try{
    const res = await apiFetch('/files/'+id, {method:'DELETE'});
    if(res.ok){ FILES_CACHE[category]=null; await loadFiles(category); }
    else { const data = await res.json(); alert(data.error||'Could not delete file.'); }
  }catch(e){ alert('Network error.'); }
}

function openTestConfig(subjId, chapId, topicId){
  if(topicId){
    const {t} = findTopic(subjId,chapId,topicId);
    pendingConfig = {subjId, chapId, topicId, max:t.questions.length, label:t.name};
  } else {
    const {c} = findChapter(subjId,chapId);
    pendingConfig = {subjId, chapId, topicId:null, max:chQCount(c), label:c.name+' (Full Chapter)'};
  }
  go('testConfig');
}
function renderTestConfig(){
  if(!pendingConfig) return renderTestsHome();
  const {s,c} = findChapter(pendingConfig.subjId, pendingConfig.chapId);
  const max = pendingConfig.max;
  return `
  <div class="breadcrumb"><a href="#" onclick="go('tests');return false;">MCQ Tests</a> / ${s.name} / ${c.name}</div>
  <div class="card card-pad" style="max-width:460px;">
    <div class="section-head"><h2>Configure Your Test</h2></div>
    <p style="font-size:13px;color:var(--sub);margin-top:-6px;"><b>${pendingConfig.label}</b> — ${max} MCQs are available. Choose how many you want — it's your call.</p>
    <div class="preset-row">
      ${[5,10,20,max].filter((v,i,a)=>a.indexOf(v)===i && v>0).map(v=>`<button class="preset-btn" onclick="setConfigCount(${v})" id="preset_${v}">${v===max?'All ('+max+')':v}</button>`).join('')}
    </div>
    <label>Number of MCQs for this test</label>
    <input type="number" id="configCount" min="1" max="${max}" value="${Math.min(10,max)}">
    <p style="font-size:12px;color:var(--sub);margin:-8px 0 14px;">Test duration: 1 minute per MCQ.</p>
    <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="launchChapterTest()">${ic('clock')} Start Test</button>
  </div>`;
}
function setConfigCount(v){ document.getElementById('configCount').value = v; }
function launchChapterTest(){
  const n = parseInt(document.getElementById('configCount').value)||1;
  const {s,c} = findChapter(pendingConfig.subjId, pendingConfig.chapId);
  let pool;
  if(pendingConfig.topicId){
    const t = c.topics.find(x=>x.id===pendingConfig.topicId);
    pool = shuffle(t.questions.map(q=>({...q, subjId:s.id, subjName:s.name, chapId:c.id, chapName:c.name, topicId:t.id, topicName:t.name})));
  } else {
    pool = shuffle(chQuestions(c).map(q=>({...q, subjId:s.id, subjName:s.name, chapId:c.id, chapName:c.name})));
  }
  const chosen = pool.slice(0, Math.min(n, pool.length));
  if(chosen.length===0){ alert('No MCQs available.'); return; }
  testSession = { label:pendingConfig.label, subLabel:s.name+' · '+c.name, color:s.color, questions:chosen, idx:0, answers:new Array(chosen.length).fill(null), timeLeft:QUESTION_TIME };
  go('testRunner');
  runTimer();
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

   MOCK TEST GENERATOR
========================================================= */
function renderMockGenerator(){
  const availableBySubj = {};
  SUBJECTS.forEach(s=> availableBySubj[s.id] = totalMCQCount(s.id));
  const selectedTotal = mockSelectedSubjects.reduce((a,id)=>a+availableBySubj[id],0);
  return `
  <div class="page-head"><div><h1>Mock Test Generator</h1><p>Build a custom test — any number of MCQs, matching the real PMDC MDCAT weightage or subjects of your choice.</p></div></div>
  <div class="card card-pad" style="max-width:620px;">
    <div class="section-head"><h2>1. How many MCQs?</h2></div>
    <div class="preset-row">
      ${[20,50,90,180].map(v=>`<button class="preset-btn ${mockCount===v?'active':''}" onclick="setMockPreset(${v})">${v===180?'180 (Full MDCAT)':v}</button>`).join('')}
    </div>
    <label>Or enter a custom number</label>
    <input type="number" id="mockCountInput" min="1" value="${mockCount}" onchange="mockCount=parseInt(this.value)||1">

    <div class="section-head" style="margin-top:6px;"><h2>2. Which subjects?</h2></div>
    <p style="font-size:12px;color:var(--sub);margin-top:-8px;">MCQs are pulled proportionally using the official PMDC weightage (Biology 45% · Chemistry 25% · Physics 20% · English 5% · Logical Reasoning 5%), scaled to whichever subjects you select.</p>
    <div>
      ${SUBJECTS.map(s=>`
        <label class="chip-select">
          <input type="checkbox" ${mockSelectedSubjects.includes(s.id)?'checked':''} onchange="toggleMockSubject('${s.id}')">
          ${s.emoji} ${s.name} <span style="color:var(--sub);font-weight:500;">(${availableBySubj[s.id]} available)</span>
        </label>`).join('')}
    </div>
    <p style="font-size:12px;color:var(--sub);margin:10px 0 16px;">Total MCQs available in selected subjects: <b>${selectedTotal}</b>${mockCount>selectedTotal?' — your requested count is higher than what is available, so the test will use all available MCQs instead.':''}</p>
    <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="generateMock()">${ic('target')} Generate Mock Test</button>
  </div>`;
}
function setMockPreset(v){ mockCount=v; render(); }
function toggleMockSubject(id){
  if(mockSelectedSubjects.includes(id)) mockSelectedSubjects = mockSelectedSubjects.filter(x=>x!==id);
  else mockSelectedSubjects.push(id);
  if(mockSelectedSubjects.length===0) mockSelectedSubjects=[id];
  render();
}
function generateMock(){
  const countInput = document.getElementById('mockCountInput');
  const total = countInput ? (parseInt(countInput.value)||1) : mockCount;
  mockCount = total;
  const selected = SUBJECTS.filter(s=>mockSelectedSubjects.includes(s.id));
  const weightSum = selected.reduce((a,s)=>a+s.weight,0);
  let picks = [];
  let remaining = total;
  selected.forEach((s,i)=>{
    const isLast = i===selected.length-1;
    const target = isLast ? remaining : Math.round(total * (s.weight/weightSum));
    const pool = shuffle(s.chapters.flatMap(c=>chQuestions(c).map(q=>({...q, subjId:s.id, subjName:s.name, chapId:c.id, chapName:c.name}))));
    const take = pool.slice(0, Math.min(target, pool.length));
    picks = picks.concat(take);
    remaining -= take.length;
  });
  picks = shuffle(picks);
  if(picks.length===0){ alert('No MCQs available for the selected subjects yet.'); return; }
  testSession = { label:'Mock Test', subLabel:(picks.length<total?`(${picks.length} of ${total} requested — that is all that is in the bank right now)`:selected.map(s=>s.name).join(', ')), color:'var(--navy)', questions:picks, idx:0, answers:new Array(picks.length).fill(null), timeLeft:QUESTION_TIME, isMock:true };
  go('testRunner');
  runTimer();
}

/* =========================================================
   TEST RUNNER / RESULT
========================================================= */
function runTimer(){
  clearInterval(window.__timerHandle);
  window.__timerHandle = setInterval(()=>{
    if(!testSession) { clearInterval(window.__timerHandle); return; }
    testSession.timeLeft--;
    if(testSession.timeLeft<=0){
      if(testSession.answers[testSession.idx]===null) testSession.answers[testSession.idx] = -1;
      nextQuestion(true);
      return;
    }
    updateTimerDisplay();
  },1000);
}
function updateTimerDisplay(){
  const badge = document.getElementById('timerBadge');
  const track = document.getElementById('qtimerTrack');
  if(!badge||!testSession) return;
  badge.textContent = testSession.timeLeft+'s';
  badge.classList.toggle('low', testSession.timeLeft<=10);
  if(track){ track.style.width = (testSession.timeLeft/QUESTION_TIME*100)+'%'; track.style.background = testSession.timeLeft<=10?'var(--red)':'var(--gold)'; }
}
function selectOption(i){ if(!testSession) return; testSession.answers[testSession.idx]=i; render(); }
function nextQuestion(auto=false){
  if(!testSession) return;
  if(testSession.idx < testSession.questions.length-1){ testSession.idx++; testSession.timeLeft=QUESTION_TIME; render(); }
  else finishTest();
}
function prevQuestion(){ if(!testSession || testSession.idx===0) return; testSession.idx--; testSession.timeLeft=QUESTION_TIME; render(); }

function finishTest(){
  clearInterval(window.__timerHandle);
  const qs = testSession.questions, ans = testSession.answers;
  const correct = ans.filter((a,i)=>a===qs[i].ans).length;
  const skipped = ans.filter(a=>a===-1||a===null).length;
  const wrong = qs.length - correct - skipped;
  testSession.result = {correct, wrong, skipped, total:qs.length};

  const bySubj = {};
  qs.forEach((q,i)=>{
    if(!bySubj[q.subjId]) bySubj[q.subjId] = {subjId:q.subjId, subjName:q.subjName, correct:0, total:0, chapName: testSession.isMock?'Mock Test':q.chapName, chapId:q.chapId};
    bySubj[q.subjId].total++;
    if(ans[i]===q.ans) bySubj[q.subjId].correct++;
  });
  Object.values(bySubj).forEach(b=>{
    DB.testHistory.unshift({subjId:b.subjId, subjName:b.subjName, chapId:b.chapId, topicName:b.chapName, score:b.correct, total:b.total, date:'Just now'});
  });
  DB.testsAttempted++;
  go('testResult');
}

function renderTestRunner(){
  if(!testSession) return renderTestsHome();
  const t = testSession, q = t.questions[t.idx], chosen = t.answers[t.idx];
  const pct = Math.round((t.idx)/t.questions.length*100);
  setTimeout(updateTimerDisplay,0);
  return `
  <div class="runner-top">
    <div><div class="breadcrumb" style="margin-bottom:2px;">${t.subLabel||''}</div><h1 style="margin:0;font-size:19px;">${t.label}</h1></div>
    <div class="timer-badge ${t.timeLeft<=10?'low':''}" id="timerBadge">${ic('clock')} ${t.timeLeft}s</div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:6px;"><span>Question ${t.idx+1} of ${t.questions.length}</span><span>${pct}% complete</span></div>
  <div class="qprogress-track"><div class="qprogress-fill" style="width:${pct}%"></div></div>
  <div style="height:4px;background:var(--line);border-radius:4px;margin:6px 0 22px;overflow:hidden;"><div id="qtimerTrack" style="height:4px;background:${t.timeLeft<=10?'var(--red)':'var(--gold)'};width:${t.timeLeft/QUESTION_TIME*100}%;transition:width 1s linear;"></div></div>
  <div class="card q-box">
    ${t.isMock?`<div class="qsubj">${q.subjName}</div>`:''}
    <h3>${t.idx+1}. ${q.q}</h3>
    ${q.opts.map((o,i)=>`<div class="opt ${chosen===i?'selected':''}" onclick="selectOption(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></div>`).join('')}
  </div>
  <div class="runner-nav">
    <button class="btn btn-outline" onclick="prevQuestion()" ${t.idx===0?'disabled':''}>← Previous</button>
    <button class="btn btn-gold" onclick="${t.idx===t.questions.length-1?'finishTest()':'nextQuestion()'}">${t.idx===t.questions.length-1?'Submit Test':'Next →'}</button>
  </div>`;
}

function renderTestResult(){
  if(!testSession || !testSession.result) return renderTestsHome();
  const r = testSession.result;
  const pct = Math.round(r.correct/r.total*100);
  const subjBreakdown = {};
  testSession.questions.forEach((q,i)=>{
    if(!subjBreakdown[q.subjId]) subjBreakdown[q.subjId] = {name:q.subjName, correct:0, total:0};
    subjBreakdown[q.subjId].total++;
    if(testSession.answers[i]===q.ans) subjBreakdown[q.subjId].correct++;
  });
  const breakdownRows = Object.values(subjBreakdown);
  return `
  <div class="card"><div class="result-hero">
    <p style="color:var(--sub);font-weight:600;margin:0 0 6px;">${testSession.label}</p>
    <div class="score">${pct}%</div>
    <p style="margin:4px 0 0;color:var(--sub);">${r.correct} out of ${r.total} correct</p>
    <div class="result-stats">
      <div class="rstat" style="background:var(--green-bg);"><b style="color:var(--green)">${r.correct}</b><span>Correct</span></div>
      <div class="rstat" style="background:var(--red-bg);"><b style="color:var(--red)">${r.wrong}</b><span>Wrong</span></div>
      <div class="rstat" style="background:var(--amber-bg);"><b style="color:var(--amber)">${r.skipped}</b><span>Skipped / Timed out</span></div>
    </div>
    ${breakdownRows.length>1?`
    <div style="text-align:left;margin-top:26px;">
      <b style="font-size:13px;">Subject-wise Breakdown</b>
      ${breakdownRows.map(b=>`<div class="weak-row" style="margin-top:10px;"><div class="top"><span>${b.name}</span><span>${b.correct}/${b.total}</span></div><div class="weak-track"><div class="weak-fill" style="width:${Math.round(b.correct/b.total*100)}%;background:var(--navy)"></div></div></div>`).join('')}
    </div>`:''}
    <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="go('tests')">Back to Tests</button>
      <button class="btn btn-navy" onclick="go('progress')">View Weakness Analysis</button>
    </div>
  </div></div>
  <div class="card card-pad" style="margin-top:16px;">
    <div class="section-head"><h2>Answer Review</h2></div>
    ${testSession.questions.map((q,i)=>{
      const chosen = testSession.answers[i]; const isCorrect = chosen===q.ans; const isSkipped = chosen===-1||chosen===null;
      return `<div style="padding:12px 0;border-bottom:1px solid var(--line);">
        <p style="margin:0 0 6px;font-weight:600;font-size:13.5px;">${i+1}. ${q.q} <span class="pill ${isSkipped?'pill-amber':(isCorrect?'pill-green':'pill-red')}" style="margin-left:6px;">${isSkipped?'Skipped':(isCorrect?'Correct':'Wrong')}</span></p>
        <p style="margin:0;font-size:12.5px;color:var(--sub);">Correct answer: <b>${q.opts[q.ans]}</b>${(!isCorrect&&!isSkipped)?` · Your answer: ${q.opts[chosen]}`:''}</p>
      </div>`;
    }).join('')}
  </div>`;
}

function renderProfile(){
  const u = CURRENT_USER;
  return `<div class="page-head"><div><h1>Profile</h1><p>Your account details.</p></div></div>
  <div class="dash-grid" style="grid-template-columns:1fr 1fr;">
  <div class="card card-pad">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
      <div class="avatar" style="width:56px;height:56px;font-size:20px;">${initials(u.name)}</div>
      <div><h3 style="margin:0;">${u.name}</h3><p style="margin:2px 0 0;color:var(--sub);font-size:13px;">${u.role==='admin'?'Administrator':'MDCAT Student'}</p></div>
    </div>
    ${u.role!=='admin' ? `<div style="margin-bottom:14px;"><span class="id-badge">${ic('user')} ${u.studentId}</span></div>` : ''}
    <div class="stat-row"><span class="lbl">${u.role==='admin'?'Admin ID':'Student ID'}</span><span class="val">${u.studentId}</span></div>
    <div class="stat-row"><span class="lbl">Email</span><span class="val">${u.email||'—'}</span></div>
    <div class="stat-row"><span class="lbl">Member Since</span><span class="val">${fmtDate(u.createdAt)}</span></div>
    ${u.role!=='admin' ? `<div class="stat-row"><span class="lbl">Account Status</span><span class="val"><span class="pill pill-green">${u.status}</span></span></div>` : ''}
    ${u.role!=='admin' ? `
    <div class="stat-row"><span class="lbl">Overall Progress</span><span class="val">${overallPct()}%</span></div>
    <div class="stat-row"><span class="lbl">Tests Attempted</span><span class="val">${DB.testsAttempted}</span></div>
    <div class="stat-row"><span class="lbl">Doubts Asked</span><span class="val">${DB.doubtsAsked}</span></div>` : ''}
  </div>
  <div class="card card-pad">
    <div class="section-head"><h2>Change Password</h2></div>
    <div id="pwMsg" style="display:none;font-size:12.5px;font-weight:600;margin:-6px 0 12px;padding:9px 12px;border-radius:9px;"></div>
    <div>
      <label>Current Password</label>
      <input type="password" id="pwCurrent" required autocomplete="current-password">
      <label>New Password (min. 8 characters)</label>
      <input type="password" id="pwNew" required minlength="8" autocomplete="new-password" onkeydown="if(event.key==='Enter')handleChangePassword(event)">
      <button class="btn btn-navy" type="button" onclick="handleChangePassword(event)" style="width:100%;justify-content:center;">Update Password</button>
    </div>
  </div>
  </div>`;
}
async function handleChangePassword(evt){
  evt.preventDefault();
  const currentPassword = document.getElementById('pwCurrent').value;
  const newPassword = document.getElementById('pwNew').value;
  const msg = document.getElementById('pwMsg');
  try{
    const res = await apiFetch('/account/password', {method:'POST', body: JSON.stringify({currentPassword, newPassword})});
    const data = await res.json();
    msg.style.display='block';
    if(res.ok){ msg.style.background='var(--green-bg)'; msg.style.color='var(--green)'; msg.textContent='Password updated.'; }
    else { msg.style.background='var(--red-bg)'; msg.style.color='var(--red)'; msg.textContent=data.error||'Could not update password.'; }
  }catch(e){ msg.style.display='block'; msg.style.background='var(--red-bg)'; msg.style.color='var(--red)'; msg.textContent='Network error.'; }
}

/* =========================================================
   ADMIN — STUDENT MANAGEMENT
========================================================= */
let ADMIN_STUDENTS = null;
let ADMIN_STU_QUERY = '';
let EDITING_STU_ID = null;   // db id currently in inline-edit mode
let RESETTING_STU_ID = null; // db id currently showing the reset-password field
// BUG FIX (Student ID / success message not appearing after creating a
// student): the old code wrote the success/error text directly onto a DOM
// node via getElementById(...).textContent, then immediately kicked off
// loadAdminStudents() to refresh the list. That refresh calls render(),
// which replaces the ENTIRE #app subtree via innerHTML -- destroying the
// very node the message was just written to, often within milliseconds.
// Net effect: the "Pre-registered -- Student ID ACA-..." message flashed
// and vanished before it could be read, and on a slow connection the form
// could look like it never responded at all.
// Fix: the flash message and the "submitting" state are now plain JS state
// (ADMIN_STU_FLASH / ADMIN_STU_SUBMITTING), rendered as part of
// renderAdminStudents()'s output, so they survive re-renders correctly
// instead of being wiped by them. The form fields are similarly backed by
// ADD_STU_FORM so they're preserved on error and deliberately cleared only
// on success -- previously any re-render wiped user-typed input.
let ADMIN_STU_FLASH = null;       // {type:'success'|'error', message}
let ADMIN_STU_SUBMITTING = false;
let ADD_STU_FORM = { name:'', studentId:'', password:'', email:'', phone:'' };

async function loadAdminStudents(q){
  try{
    const qs = q ? ('?q='+encodeURIComponent(q)) : '';
    const res = await apiFetch('/admin/students'+qs);
    const data = await res.json();
    ADMIN_STUDENTS = res.ok ? data.students : [];
  }catch(e){ ADMIN_STUDENTS = []; }
  render();
}
function statusPill(status){
  const map = { PRE_REGISTERED:'pill-amber', ACTIVE:'pill-green', DISABLED:'pill-red' };
  const label = { PRE_REGISTERED:'Pre-registered', ACTIVE:'Active', DISABLED:'Disabled' };
  return `<span class="pill ${map[status]||'pill-blue'}">${label[status]||status}</span>`;
}
function renderAdminStudents(){
  if(ADMIN_STUDENTS===null){ loadAdminStudents(ADMIN_STU_QUERY); }
  const flash = ADMIN_STU_FLASH ? `
    <div style="font-size:12.5px;font-weight:600;margin:-6px 0 12px;padding:9px 12px;border-radius:9px;
      background:${ADMIN_STU_FLASH.type==='success'?'var(--green-bg)':'var(--red-bg)'};
      color:${ADMIN_STU_FLASH.type==='success'?'var(--green)':'var(--red)'};">
      ${ADMIN_STU_FLASH.message}
    </div>` : '';
  return `
  <div class="page-head"><div><h1>Manage Students</h1><p>Pre-register a Student ID + password; the student activates it themselves with those exact credentials.</p></div></div>
  <div class="dash-grid" style="grid-template-columns:1fr 1.6fr;">
    <div class="card card-pad">
      <div class="section-head"><h2>Add / Pre-Register Student</h2></div>
      ${flash}
      <div>
        <label>Full Name</label>
        <input type="text" id="stuName" required value="${ADD_STU_FORM.name}" oninput="ADD_STU_FORM.name=this.value">
        <label>Student ID <span style="font-weight:400;color:var(--sub);">(leave blank to auto-generate)</span></label>
        <input type="text" id="stuId" placeholder="e.g. ACA-004" value="${ADD_STU_FORM.studentId}" oninput="ADD_STU_FORM.studentId=this.value">
        <label>Initial Password (min. 8 characters)</label>
        <input type="text" id="stuPassword" required minlength="8" value="${ADD_STU_FORM.password}" oninput="ADD_STU_FORM.password=this.value" onkeydown="if(event.key==='Enter')handleAddStudent(event)">
        <label>Email <span style="font-weight:400;color:var(--sub);">(optional)</span></label>
        <input type="email" id="stuEmail" value="${ADD_STU_FORM.email}" oninput="ADD_STU_FORM.email=this.value">
        <label>Phone <span style="font-weight:400;color:var(--sub);">(optional)</span></label>
        <input type="text" id="stuPhone" value="${ADD_STU_FORM.phone}" oninput="ADD_STU_FORM.phone=this.value">
        <button class="btn btn-gold" type="button" onclick="handleAddStudent(event)" style="width:100%;justify-content:center;" ${ADMIN_STU_SUBMITTING?'disabled':''}>
          ${ic('user')} ${ADMIN_STU_SUBMITTING?'Pre-Registering…':'Pre-Register Student'}
        </button>
      </div>
      <p style="font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.6;">The student is created as <b>Pre-registered</b>. They can't log in until they visit "Activate Student Account" and enter this exact Student ID + password.</p>
    </div>
    <div class="card card-pad">
      <div class="section-head"><h2>All Students${ADMIN_STUDENTS?` (${ADMIN_STUDENTS.length})`:''}</h2></div>
      <div style="margin-bottom:14px;">
        <input type="text" id="stuSearch" placeholder="Search by name, Student ID, or email…" value="${ADMIN_STU_QUERY}" oninput="handleStudentSearch(this.value)" style="margin-bottom:0;">
      </div>
      ${ADMIN_STUDENTS===null?`<div class="empty-state">Loading…</div>`:
        ADMIN_STUDENTS.length===0?`<div class="empty-state">No accounts found.</div>`:
        ADMIN_STUDENTS.map(s=>renderAdminStudentRow(s)).join('')}
    </div>
  </div>`;
}
function renderAdminStudentRow(s){
  const isEditing = EDITING_STU_ID===s.id;
  const isResetting = RESETTING_STU_ID===s.id;
  return `
  <div class="chapter-card" style="margin-bottom:10px;">
    <div class="chead">
      <div>
        <h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">${s.name} ${statusPill(s.status)} ${s.role==='admin'?'<span class="pill pill-blue">Admin</span>':''}</h3>
        <div class="cmeta">${s.studentId} · ${s.email||'no email'}${s.phone?' · '+s.phone:''}</div>
        <div class="cmeta">Joined ${fmtDate(s.createdAt)} · Activated ${fmtDate(s.activatedAt)} · Last login ${fmtDateTime(s.lastLoginAt)}</div>
      </div>
      <div class="topic-actions">
        <button class="btn btn-outline btn-sm" onclick="toggleEditStudent(${s.id})">${isEditing?'Cancel':'Edit'}</button>
        <button class="btn btn-outline btn-sm" onclick="toggleResetPassword(${s.id})">${isResetting?'Cancel':'Reset Password'}</button>
        ${s.status!=='DISABLED'
          ? `<button class="btn btn-outline btn-sm" onclick="setStudentStatus(${s.id},'DISABLED')">Disable</button>`
          : `<button class="btn btn-outline btn-sm" onclick="setStudentStatus(${s.id},'ACTIVE')">Enable</button>`}
        ${s.status==='PRE_REGISTERED' ? `<button class="btn btn-blue btn-sm" onclick="setStudentStatus(${s.id},'ACTIVE')">Force Activate</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="deleteStudent(${s.id},'${s.name.replace(/'/g,"\\'")}')" style="color:var(--red);">${ic('trash')} Delete</button>
      </div>
    </div>
    ${isEditing ? `
    <div class="topic-row" style="display:block;">
      <div id="editMsg_${s.id}" style="display:none;font-size:12px;font-weight:600;margin-bottom:10px;padding:8px 12px;border-radius:9px;"></div>
      <label>Name</label><input type="text" id="editName_${s.id}" value="${s.name}">
      <label>Email</label><input type="email" id="editEmail_${s.id}" value="${s.email||''}">
      <label>Phone</label><input type="text" id="editPhone_${s.id}" value="${s.phone||''}">
      <button class="btn btn-navy btn-sm" onclick="saveStudentEdit(${s.id})">Save Changes</button>
    </div>` : ''}
    ${isResetting ? `
    <div class="topic-row" style="display:block;">
      <div id="resetMsg_${s.id}" style="display:none;font-size:12px;font-weight:600;margin-bottom:10px;padding:8px 12px;border-radius:9px;"></div>
      <label>New Password (min. 8 characters)</label>
      <input type="text" id="resetPw_${s.id}" minlength="8" placeholder="New password for ${s.studentId}">
      <button class="btn btn-navy btn-sm" onclick="saveResetPassword(${s.id})">Set New Password</button>
    </div>` : ''}
  </div>`;
}
let stuSearchTimer = null;
function handleStudentSearch(v){
  ADMIN_STU_QUERY = v;
  clearTimeout(stuSearchTimer);
  stuSearchTimer = setTimeout(()=>{ ADMIN_STUDENTS=null; loadAdminStudents(v); }, 300);
}
function toggleEditStudent(id){ EDITING_STU_ID = EDITING_STU_ID===id ? null : id; RESETTING_STU_ID=null; render(); }
function toggleResetPassword(id){ RESETTING_STU_ID = RESETTING_STU_ID===id ? null : id; EDITING_STU_ID=null; render(); }

async function handleAddStudent(evt){
  evt.preventDefault();
  const { name, studentId, password, email, phone } = ADD_STU_FORM;

  if(!name.trim() || password.length < 8){
    ADMIN_STU_FLASH = { type:'error', message: 'Name and a password of at least 8 characters are required.' };
    render();
    return;
  }

  ADMIN_STU_SUBMITTING = true; ADMIN_STU_FLASH = null;
  render();
  try{
    const res = await apiFetch('/admin/students', {
      method:'POST',
      body: JSON.stringify({ name: name.trim(), studentId: studentId.trim(), password, email: email.trim(), phone: phone.trim() }),
    });
    const data = await res.json();
    if(res.ok){
      ADMIN_STU_FLASH = { type:'success', message: `Pre-registered — Student ID ${data.user.studentId}. Give the student this ID and password to activate.` };
      ADD_STU_FORM = { name:'', studentId:'', password:'', email:'', phone:'' };
      ADMIN_STUDENTS = null;
      loadAdminStudents(ADMIN_STU_QUERY); // re-fetches the list and re-renders when done
    } else {
      // Covers duplicate email / duplicate Student ID / validation errors --
      // always a clear message, never a silent stuck state.
      ADMIN_STU_FLASH = { type:'error', message: data.error || 'Could not create student.' };
    }
  }catch(e){
    ADMIN_STU_FLASH = { type:'error', message:'Network error. Check your connection and try again.' };
  } finally {
    // Always reached, whether success, a handled error response, or a
    // thrown exception -- the button can never get stuck disabled/loading.
    ADMIN_STU_SUBMITTING = false;
    render();
  }
}
async function saveStudentEdit(id){
  const name = document.getElementById('editName_'+id).value.trim();
  const email = document.getElementById('editEmail_'+id).value.trim();
  const phone = document.getElementById('editPhone_'+id).value.trim();
  const msg = document.getElementById('editMsg_'+id);
  try{
    const res = await apiFetch('/admin/students/'+id, {method:'PATCH', body: JSON.stringify({name, email, phone})});
    const data = await res.json();
    msg.style.display='block';
    if(res.ok){ msg.style.background='var(--green-bg)'; msg.style.color='var(--green)'; msg.textContent='Saved.'; EDITING_STU_ID=null; ADMIN_STUDENTS=null; loadAdminStudents(ADMIN_STU_QUERY); }
    else { msg.style.background='var(--red-bg)'; msg.style.color='var(--red)'; msg.textContent = data.error||'Could not save.'; }
  }catch(e){ msg.style.display='block'; msg.style.background='var(--red-bg)'; msg.style.color='var(--red)'; msg.textContent='Network error.'; }
}
async function saveResetPassword(id){
  const newPassword = document.getElementById('resetPw_'+id).value;
  const msg = document.getElementById('resetMsg_'+id);
  try{
    const res = await apiFetch('/admin/students/'+id+'/reset-password', {method:'POST', body: JSON.stringify({newPassword})});
    const data = await res.json();
    msg.style.display='block';
    if(res.ok){ msg.style.background='var(--green-bg)'; msg.style.color='var(--green)'; msg.textContent='Password updated.'; setTimeout(()=>{RESETTING_STU_ID=null; render();},1200); }
    else { msg.style.background='var(--red-bg)'; msg.style.color='var(--red)'; msg.textContent = data.error||'Could not reset password.'; }
  }catch(e){ msg.style.display='block'; msg.style.background='var(--red-bg)'; msg.style.color='var(--red)'; msg.textContent='Network error.'; }
}
async function setStudentStatus(id, status){
  try{
    const res = await apiFetch('/admin/students/'+id+'/status', {method:'POST', body: JSON.stringify({status})});
    if(res.ok){ ADMIN_STUDENTS=null; loadAdminStudents(ADMIN_STU_QUERY); }
    else { const data = await res.json(); alert(data.error||'Could not update status.'); }
  }catch(e){ alert('Network error.'); }
}
async function deleteStudent(id, name){
  if(!confirm(`Permanently delete ${name}? This also removes their uploaded files. This cannot be undone.`)) return;
  try{
    const res = await apiFetch('/admin/students/'+id, {method:'DELETE'});
    if(res.ok){ ADMIN_STUDENTS=null; loadAdminStudents(ADMIN_STU_QUERY); }
    else { const data = await res.json(); alert(data.error||'Could not delete student.'); }
  }catch(e){ alert('Network error.'); }
}

boot();
</script>
</body>
